  <section id="use-sdk-flow">
<span id="id1"></span><h1>1 使用流程<a class="headerlink" href="#use-sdk-flow" title="Link to this heading"></a></h1>
<figure class="align-center" id="id2">
<div class="graphviz"><object data="../../_images/graphviz-9d18cc82873eb537d0096bd1976a34be963c7da1.svg" type="image/svg+xml" class="graphviz">
<p class="warning">digraph flow {

    start -&gt; init_1 [lhead=&quot;cluster_init&quot;];
    init_2 -&gt; cluster_connect [ltail=&quot;cluster_init&quot;];
    cluster_connect -&gt; connect_ok;
    connect_ok -&gt; cluster_connect [label=&quot;NO&quot;];
    connect_ok -&gt; cluster_operation [label=&quot;YES&quot;];
    cluster_operation -&gt; reseale -&gt; end;

    start [label=&quot;Start&quot;, shape=&quot;Mdiamond&quot;];
    subgraph cluster_init {
        label=&quot;初始化流程&quot;;
        init_1 -&gt; init_2;

        init_1 [label=&quot;初始化JL_BluetoothManager&quot;, shape=&quot;record&quot;];
        init_2 [label=&quot;配置JL_BluetoothManager参数&quot;, shape=&quot;record&quot;];
    }
    subgraph cluster_connect {
        label=&quot;连接设备流程&quot;;
        begin -&gt; listen -&gt; scan -&gt; foudn_ok;
        foudn_ok -&gt; scan [label=&quot;NO&quot;];
        foudn_ok -&gt; connect [label=&quot;YES&quot;];
        connect -&gt; output -&gt; finish;

        begin [label=&quot;开始&quot;, shape=&quot;Mdiamond&quot;];
        listen [label=&quot;添加蓝牙事件监听器&quot;, shape=&quot;record&quot;];
        scan [label=&quot;扫描BLE设备&quot;, shape=&quot;record&quot;]
        foudn_ok [label=&quot;是否发现目标设备?&quot;, shape=&quot;diamond&quot;];
        connect [label=&quot;连接目标设备&quot;, shape=&quot;record&quot;];
        output [label=&quot;输出结果并移除蓝牙事件监听器&quot;, shape=&quot;record&quot;];
        finish [label=&quot;结束&quot;, shape=&quot;Msquare&quot;];
    }

    subgraph cluster_operation {
        label=&quot;使用接口流程&quot;;

        op_0 -&gt; op_1 -&gt; op_2 -&gt; op_3 -&gt; op_4;

        op_0 [label=&quot;获取JL_BluetoothManager对象&quot;, shape=&quot;record&quot;];
        op_1 [label=&quot;添加蓝牙RCSP事件监听器&quot;, shape=&quot;record&quot;];
        op_2 [label=&quot;调用接口实现功能&quot;, shape=&quot;record&quot;];
        op_3 [label=&quot;等待结果回调并处理&quot;, shape=&quot;record&quot;];
        op_4 [label=&quot;移除蓝牙RCSP事件监听器&quot;, shape=&quot;record&quot;];
    }

    connect_ok [label=&quot;是否连接成功?&quot;, shape=&quot;diamond&quot;];
    reseale [label=&quot;销毁JL_BluetoothManager对象&quot;, shape=&quot;record&quot;];
    end [label=&quot;End&quot;, shape=&quot;Msquare&quot;];
}</p></object></div>
<figcaption>
<p><span class="caption-text">杰理之家SDK使用流程</span><a class="headerlink" href="#id2" title="Link to this image"></a></p>
</figcaption>
</figure>
</section>
